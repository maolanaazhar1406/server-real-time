apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtserver
  labels:
    app: rtserver
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rtserver
  template:
    metadata:
      labels:
        app: rtserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rtserver
          image: rtserver:1.0.0
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISTRIBUTED_BACKEND
              value: "redis"
            - name: REDIS_ADDR
              value: "redis:6379"
          ports:
            - name: websocket
              containerPort: 8080
              protocol: TCP
            - name: observability
              containerPort: 8081
              protocol: TCP
            - name: tcp
              containerPort: 9000
              protocol: TCP
            - name: udp
              containerPort: 9001
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: observability
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: observability
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rtserver
spec:
  selector:
    app: rtserver
  sessionAffinity: ClientIP
  ports:
    - name: websocket
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: udp
      port: 9001
      targetPort: 9001
      protocol: UDP
    - name: observability
      port: 8081
      targetPort: 8081
      protocol: TCP
