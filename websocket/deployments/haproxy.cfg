global
    maxconn 100000
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  120s
    timeout server  120s
    timeout tunnel  1h

frontend ws_frontend
    mode http
    bind *:8080
    default_backend ws_nodes

backend ws_nodes
    mode http
    balance source
    hash-type consistent
    option httpchk GET /readyz
    http-check expect status 200
    cookie RTSERVER_NODE insert indirect nocache
    server node1 node-1:8080 check port 8081 cookie n1
    server node2 node-2:8080 check port 8081 cookie n2

frontend tcp_frontend
    mode tcp
    bind *:9000
    default_backend tcp_nodes

backend tcp_nodes
    mode tcp
    balance leastconn
    option httpchk GET /readyz
    http-check expect status 200
    server node1 node-1:9000 check port 8081
    server node2 node-2:9000 check port 8081
