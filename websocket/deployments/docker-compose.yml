services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-1:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      NODE_ID: node-1
      DISTRIBUTED_BACKEND: redis
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "18080:8080"
      - "18081:8081"
      - "19000:9000"
      - "19001:9001/udp"

  node-2:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      NODE_ID: node-2
      DISTRIBUTED_BACKEND: redis
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "28080:8080"
      - "28081:8081"
      - "29000:9000"
      - "29001:9001/udp"

  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - node-1
      - node-2
    ports:
      - "8080:8080"
      - "9000:9000"
